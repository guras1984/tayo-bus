plugins { id 'com.android.application' }
android {
    namespace 'kr.kj.tayo'
    compileSdk 35
    defaultConfig {
        applicationId 'kr.kj.tayo'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        release {
            if (System.getenv('TAYO_SIGNING_STORE')) {
                storeFile file(System.getenv('TAYO_SIGNING_STORE'))
                storePassword System.getenv('TAYO_SIGNING_PASSWORD')
                keyAlias 'tayo'
                keyPassword System.getenv('TAYO_SIGNING_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            debuggable false
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}
